<!DOCTYPE html>
<html>

<head>

    <title>Sales Forecasting</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->

    <nav id="sidebar">

        <h2 class="logo">
            📊 AI Retail
        </h2>

        <ul>

            <li>
                <a href="/">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="/insights">
                    🤖 AI Insights
                </a>
            </li>

            <li>
                <a class="active" href="/forecast">
                    📈 Forecasting
                </a>
            </li>

        </ul>

        <div class="developer">
            👨‍💻 Manan Kumar
        </div>

    </nav>

    <!-- CONTENT -->

    <div id="content">

        <h1>
            📈 Sales Forecasting
        </h1>

        <p class="subtitle">
            Machine Learning Based Sales Prediction
        </p>

        <div class="row mb-4">

            <div class="col-md-4">

                <div class="card p-4">

                    <h5>🤖 Model Used</h5>

                    <h2>
                        Linear Regression
                    </h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4">

                    <h5>💰 Next Month Forecast</h5>

                    <h2>
                        ${{ forecast_value }}
                    </h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4">

                    <h5>📈 Expected Growth</h5>

                    <h2>
                        {{ growth_rate }}%
                    </h2>

                </div>

            </div>

        </div>

        <div class="card p-4">

            {{ forecast_graph|safe }}

        </div>

    </div>

</div>

</body>

</html>
